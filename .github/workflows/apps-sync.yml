name: Update App Store Stats

on:
  schedule:
    - cron: '0 4 1 * *'  # 1st of every month at 04:00 UTC
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch app data
        run: node script.js
        timeout-minutes: 60   # Fetcher can be slow; fail cleanly if it hangs

      - name: Run analysis
        run: node analyzer.js

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --staged --quiet || git commit -m "🔄️Monthly App Store sync [$(date -u +%Y-%m)]"
          git push
